<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
<!-- style-src allows unsafe-inline: all inline style="" attributes are developer-authored; no user data ever reaches a style attribute. script-src stays strict (no unsafe-inline). -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile — TypeMaster</title>
<meta name="description" content="Manage your TypeMaster profile: name, password, theme, language, and your data.">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="site-nav"></div>
<main class="container">
  <div class="page-head">
    <h1 class="section-title" data-i18n="profile_title">Profile</h1>
    <p class="section-sub" id="userSub"></p>
  </div>

  <div class="card mb-3">
    <h2 class="section-title" style="font-size:1.15rem" data-i18n="change_name">Change name</h2>
    <div class="form-group">
      <div class="picker-row">
        <input type="text" id="nameInput" class="form-control" style="max-width:280px" data-i18n-ph="new_name" placeholder="New name">
        <button class="btn btn-primary btn-sm" id="nameBtn" data-i18n="save">Save</button>
      </div>
    </div>
  </div>

  <div class="card mb-3">
    <h2 class="section-title" style="font-size:1.15rem" data-i18n="change_password">Change password</h2>
    <div class="form-card" style="margin:0">
      <div class="form-group">
        <input type="password" id="pwOld" class="form-control" data-i18n-ph="old_password" placeholder="Current password">
      </div>
      <div class="form-group">
        <input type="password" id="pwNew" class="form-control" data-i18n-ph="new_password" placeholder="New password">
      </div>
      <div class="form-group">
        <input type="password" id="pwConfirm" class="form-control" data-i18n-ph="new_password" placeholder="Confirm new password">
      </div>
      <button class="btn btn-primary btn-sm" id="pwBtn" data-i18n="save">Save</button>
    </div>
  </div>

  <div class="card mb-3">
    <h2 class="section-title" style="font-size:1.15rem" data-i18n="appearance">Appearance</h2>
    <div class="form-group">
      <label style="display:flex;align-items:center;gap:10px;cursor:pointer">
        <input type="checkbox" id="themeChk" style="width:20px;height:20px">
        <span data-i18n="dark_mode">Dark mode</span>
      </label>
    </div>
    <div class="form-group">
      <label class="form-note" data-i18n="language">Language</label>
      <div class="picker-row" id="langRow">
        <button class="pick" data-lang="en">English</button>
        <button class="pick" data-lang="ur">اردو</button>
      </div>
    </div>
  </div>

  <div class="card mb-3">
    <h2 class="section-title" style="font-size:1.15rem" data-i18n="your_data">Your data</h2>
    <button class="btn btn-outline btn-sm" id="dlBtn" data-i18n="download_data">Download my data</button>
  </div>

  <div class="card mb-3" style="border-color:var(--error)">
    <h2 class="section-title" style="font-size:1.15rem" data-i18n="danger_zone">Danger zone</h2>
    <button class="btn btn-sm" id="resetBtn" style="color:var(--error);border:1px solid var(--error)" data-i18n="reset_progress">Reset progress</button>
  </div>

  <div class="text-center mt-3">
    <button class="btn btn-ghost" id="logoutBtn2" data-i18n="nav_logout">Logout</button>
  </div>
</main>
<div id="site-foot"></div>
<script src="js/urdu.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/profile.js"></script>
</body>
</html>
