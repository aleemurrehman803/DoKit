<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TypeMaster — Sign Up</title>
<meta name="description" content="Create your free TypeMaster account and start learning touch typing.">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="site-nav"></div>
<main class="container">

  <div class="card form-card">
    <h1 class="section-title" data-i18n="signup_title">Create your account</h1>
    <form id="signupForm" novalidate>
      <div class="form-group">
        <label for="name" data-i18n="your_name">Your name</label>
        <input class="form-control" id="name" name="name" type="text" autocomplete="name">
        <div class="form-error" id="err-name"></div>
      </div>
      <div class="form-group">
        <label for="email" data-i18n="email">Email</label>
        <input class="form-control" id="email" name="email" type="email" autocomplete="email">
        <div class="form-error" id="err-email"></div>
      </div>
      <div class="form-group">
        <label for="password" data-i18n="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="new-password">
        <div class="form-error" id="err-password"></div>
      </div>
      <div class="form-group">
        <label for="confirm" data-i18n="confirm_password">Confirm password</label>
        <input class="form-control" id="confirm" name="confirm" type="password" autocomplete="new-password">
        <div class="form-error" id="err-confirm"></div>
      </div>
      <button class="btn btn-primary" type="submit" data-i18n="create_account">Create Account</button>
    </form>
    <p class="form-note mt-2 text-center">
      <span data-i18n="have_account">Already have an account?</span>
      <a href="login.html" data-i18n="nav_login">Log In</a>
    </p>
  </div>

</main>
<div id="site-foot"></div>
<script src="js/urdu.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  UI.init({ active: '' });
  const form = document.getElementById('signupForm');
  const setErr = (id, key) => { document.getElementById(id).textContent = key ? UI.t(key) : ''; };
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    ['err-name', 'err-email', 'err-password', 'err-confirm'].forEach(id => setErr(id, null));
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const pw = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    let bad = false;
    if (!name) { setErr('err-name', 'err_name'); bad = true; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { setErr('err-email', 'err_email'); bad = true; }
    if (pw.length < 6) { setErr('err-password', 'err_pw_short'); bad = true; }
    if (confirm !== pw) { setErr('err-confirm', 'err_pw_match'); bad = true; }
    if (bad) return;
    const res = await DB.signup(name, email, pw);
    if (!res.ok && res.error === 'taken') {
      setErr('err-email', 'err_email_taken');
      return;
    }
    location.href = 'dashboard.html';
  });
});
</script>
</body>
</html>
