<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TypeMaster — Log In</title>
<meta name="description" content="Log in to your TypeMaster account to continue learning touch typing.">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="site-nav"></div>
<main class="container">

  <div class="card form-card">
    <div class="page-header center">
      <p class="eyebrow" data-i18n="d_eyebrow_login">Member access</p>
      <h1 class="section-title" data-i18n="login_title">Welcome back</h1>
    </div>
    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email" data-i18n="email">Email</label>
        <input class="form-control" id="email" name="email" type="email" autocomplete="email">
        <div class="form-error" id="err-email"></div>
      </div>
      <div class="field">
        <label for="password" data-i18n="password">Password</label>
        <input class="form-control" id="password" name="password" type="password" autocomplete="current-password">
        <div class="form-error" id="err-password"></div>
      </div>
      <button class="btn btn-primary" type="submit" style="width:100%" data-i18n="login_btn">Log In</button>
      <p class="mt-2 text-center">
        <a href="#" id="forgotLink" data-i18n="forgot_password">Forgot password?</a>
      </p>
    </form>
    <p class="form-note mt-2 text-center">
      <span data-i18n="no_account">New to TypeMaster?</span>
      <a href="signup.html" data-i18n="nav_signup">Sign Up</a>
    </p>
  </div>

</main>
<div id="site-foot"></div>
<script src="js/urdu.js"></script>
<script src="js/urdu2.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/pages/login.js"></script>
</body>
</html>
