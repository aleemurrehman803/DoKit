<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TypeMaster — Dashboard</title>
<meta name="description" content="Your TypeMaster dashboard: stats, problem keys, and recent typing tests.">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="site-nav"></div>
<main class="container">

  <div class="page-head">
    <h1 data-i18n="dash_title">Dashboard</h1>
    <p class="text-muted">
      <span data-i18n="welcome">Welcome</span>, <strong id="userName"></strong>
      <span class="plan-badge"><span data-i18n="plan_label">Plan</span>: <span data-i18n="plan_free">Free</span></span>
    </p>
  </div>

  <div class="stat-grid" id="statGrid">
    <div class="card stat-card">
      <div class="stat-num"><a id="continueLink" href="lessons.html">—</a></div>
      <div class="stat-label" data-i18n="continue_lesson">Continue Learning</div>
    </div>
    <div class="card stat-card">
      <div class="stat-num" id="bestWpm">0</div>
      <div class="stat-label" data-i18n="best_wpm">Best WPM</div>
    </div>
    <div class="card stat-card">
      <div class="stat-num" id="streakCount">0</div>
      <div class="stat-label" data-i18n="day_streak">Day Streak</div>
    </div>
    <div class="card stat-card">
      <div class="stat-num" id="levelLabel">—</div>
      <div class="stat-label" data-i18n="xp_level">Level</div>
    </div>
  </div>

  <div class="grid grid-2 mt-3">
    <div class="card">
      <h2 class="section-title" data-i18n="problem_keys">Problem Keys</h2>
      <div id="problemKeys" class="mt-2"></div>
    </div>
    <div class="card">
      <h2 class="section-title" data-i18n="recent_tests">Recent Tests</h2>
      <div id="recentTests" class="mt-2"></div>
    </div>
  </div>

</main>
<div id="site-foot"></div>
<script src="js/urdu.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/curriculum.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  UI.init({ active: '' });
  const user = DB.requireUser();
  if (!user) return;

  document.getElementById('userName').textContent = user.name;

  const progress = DB.getProgress();

  // Continue Learning: first lesson in order that is not done and unlocked.
  let nextId = null;
  for (const id of CURR_ORDER) {
    const rec = progress.lessons[id];
    if (!rec || !rec.done) {
      if (isUnlocked(id, progress)) { nextId = id; }
      break;
    }
  }
  const continueLink = document.getElementById('continueLink');
  if (nextId) {
    continueLink.href = 'lesson.html?id=' + encodeURIComponent(nextId);
    continueLink.textContent = getLesson(nextId).title;
  } else {
    continueLink.href = 'lessons.html';
    continueLink.textContent = UI.t('start_first_lesson');
  }

  document.getElementById('bestWpm').textContent = DB.bestWPM();
  document.getElementById('streakCount').textContent = progress.streak.count || 0;
  const lvl = DB.level();
  document.getElementById('levelLabel').textContent = 'Level ' + lvl + ' · ' + UI.levelName(lvl);

  // Problem keys
  const pkWrap = document.getElementById('problemKeys');
  const pks = DB.problemKeys(8);
  if (pks.length === 0) {
    pkWrap.innerHTML = '<p class="text-muted" data-i18n="no_problem_keys">No problem keys yet — keep practicing!</p>';
    UI.applyI18n(pkWrap);
  } else {
    pkWrap.innerHTML = pks.map(k =>
      '<span class="key-pill" title="' + Math.round(k.acc * 100) + '% ' + UI.t('correct') + '">' +
      UI.esc(k.ch === ' ' ? 'Space' : k.ch) + '</span>'
    ).join('');
  }

  // Recent tests (last 5)
  const rtWrap = document.getElementById('recentTests');
  const tests = (progress.tests || []).slice(0, 5);
  if (tests.length === 0) {
    rtWrap.innerHTML = '<p class="text-muted" data-i18n="no_tests">No tests yet. Take your first test!</p>';
    UI.applyI18n(rtWrap);
  } else {
    let rows = tests.map(t =>
      '<tr><td>' + UI.esc(new Date(t.date).toLocaleDateString()) + '</td>' +
      '<td>' + UI.esc(t.cat || '') + '</td>' +
      '<td>' + UI.esc(String(t.dur)) + ' min</td>' +
      '<td>' + UI.esc(String(t.nwpm)) + '</td>' +
      '<td>' + UI.esc(String(t.acc)) + '%</td></tr>'
    ).join('');
    rtWrap.innerHTML = '<table class="data-table"><thead><tr><th>Date</th><th>Category</th><th>Duration</th><th>WPM</th><th>Acc</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }
});
</script>
</body>
</html>
