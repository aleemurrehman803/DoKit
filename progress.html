<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Progress — TypeMaster</title>
<meta name="description" content="Track your typing progress: WPM trend charts, practice streaks, goals, and badges.">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="site-nav"></div>
<main class="container">
  <div class="page-head">
    <h1 class="section-title" data-i18n="progress_title">My Progress</h1>
  </div>

  <div class="card mb-3">
    <h2 class="section-title" style="font-size:1.15rem" data-i18n="trend_title">Progress trend</h2>
    <canvas id="trendChart" style="width:100%"></canvas>
    <p class="text-muted hidden" id="noTrend" data-i18n="no_data">No data yet.</p>
  </div>

  <div class="card mb-3">
    <h2 class="section-title" style="font-size:1.15rem" data-i18n="streak_title">Practice streak</h2>
    <div id="streakCal"></div>
  </div>

  <div class="card mb-3">
    <h2 class="section-title" style="font-size:1.15rem" data-i18n="goal_title">My goal</h2>
    <div class="form-group">
      <label class="form-note" data-i18n="target_wpm">Target WPM</label>
      <div class="picker-row">
        <input type="number" id="goalInput" class="form-control" style="max-width:160px" min="10" max="200">
        <button class="btn btn-primary" id="goalBtn" data-i18n="set_goal">Set Goal</button>
      </div>
      <p class="text-muted"><span data-i18n="target_wpm">Target WPM</span>: <strong id="goalCur">—</strong></p>
    </div>
  </div>

  <div class="card mb-3">
    <h2 class="section-title" style="font-size:1.15rem" data-i18n="badges_title">Badges</h2>
    <p class="text-muted hidden" id="noBadges" data-i18n="no_badges">No badges earned yet.</p>
    <div class="grid grid-4" id="badgeGrid" style="gap:10px"></div>
  </div>

  <div class="stat-grid">
    <div class="stat-card"><div class="stat-num" id="tTests">0</div><div class="stat-label" data-i18n="total_tests">Total tests</div></div>
    <div class="stat-card"><div class="stat-num" id="tLessons">0</div><div class="stat-label" data-i18n="lessons_done">Lessons done</div></div>
    <div class="stat-card"><div class="stat-num" id="tXp">0</div><div class="stat-label" data-i18n="total_xp">Total XP</div></div>
  </div>
</main>
<div id="site-foot"></div>
<script src="js/urdu.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/gamification.js"></script>
<script src="js/charts.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  if (!DB.requireUser()) return;
  UI.init({ active: "progress" });

  const p = DB.getProgress();

  // trend chart — last 20 tests, chronological
  const tests = (p.tests || []).slice(0, 20).reverse();
  const canvas = document.getElementById("trendChart");
  if (tests.length >= 2) {
    Charts.trend(
      canvas,
      tests.map(t => new Date(t.date).toLocaleDateString()),
      tests.map(t => t.nwpm || 0),
      tests.map(t => t.acc || 0)
    );
  } else {
    canvas.classList.add("hidden");
    document.getElementById("noTrend").classList.remove("hidden");
  }

  // streak calendar
  Charts.streakCal(document.getElementById("streakCal"), p);

  // goal
  const goalCur = document.getElementById("goalCur");
  const goalInput = document.getElementById("goalInput");
  const cur = (p.goals && p.goals.targetWpm) || 40;
  goalCur.textContent = cur;
  goalInput.value = cur;
  document.getElementById("goalBtn").onclick = () => {
    const v = parseInt(goalInput.value, 10);
    DB.setGoal(isNaN(v) ? 40 : v);
    const np = DB.getProgress();
    goalCur.textContent = np.goals.targetWpm;
    goalInput.value = np.goals.targetWpm;
    UI.toast(UI.t("goal_saved"));
  };

  // badges
  const earned = p.badges || [];
  const grid = document.getElementById("badgeGrid");
  if (!earned.length) document.getElementById("noBadges").classList.remove("hidden");
  grid.innerHTML = BADGES.map(b => {
    const info = Game.badgeInfo(b.id, UI.lang);
    const has = earned.includes(b.id);
    return "<div class=\"badge-chip\" style=\"" + (has ? "" : "opacity:.35;filter:grayscale(1);") + "\">" +
      "<div style=\"font-size:1.6rem\">" + b.icon + "</div>" +
      "<div><strong>" + UI.esc(info ? info.name : b.id) + "</strong>" +
      "<div class=\"text-muted\" style=\"font-size:.8rem\">" + UI.esc(info ? info.desc : "") + "</div></div></div>";
  }).join("");

  // totals
  document.getElementById("tTests").textContent = (p.tests || []).length;
  document.getElementById("tLessons").textContent =
    Object.keys(p.lessons || {}).filter(k => p.lessons[k] && p.lessons[k].done).length;
  document.getElementById("tXp").textContent = p.xp || 0;
});
</script>
</body>
</html>
