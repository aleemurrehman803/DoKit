<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
<meta name="theme-color" content="#6C4CF1">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icon.svg">
<title>Offline — DoKit</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/hub.css">
<script src="/js/i18n.js" defer></script>
<style>
.offline-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:var(--sp-4)}
.offline-card{text-align:center;max-width:28rem}
.offline-card img{width:4.5rem;height:4.5rem;margin-bottom:var(--sp-4)}
</style>
</head>
<body>
<main class="offline-wrap">
  <div class="card offline-card">
    <img src="/assets/logo.svg" alt="DoKit logo" width="72" height="72">
    <h1 data-i18n="offline.title">You're offline</h1>
    <p style="color:var(--text-muted)" data-i18n="offline.desc">DoKit needs a connection for this page. Reconnect and try again — your tools will be right here.</p>
    <p><a class="btn btn-primary" href="/" data-i18n="offline.retry">Try again</a></p>
  </div>
</main>
</body>
</html>
