<!-- Doki character — ONE source SVG (item 119, Oct 25, 2026; REDRAWN same day per owner order "fix it").
     Source of truth: the user's video frames (320x320). This SVG is
     mapped from those frames at 0.75 scale (video px * 0.75 = SVG units).
     REDRAW (fixes the 44-point audit, doki-mistakes/DOKI-MISTAKES-AUDIT.md):
     round bead eyes (not tall ovals); face tilted -4 deg for a real 3/4
     read with the far eye smaller/higher; smaller stronger blush; hairline
     smile; dense fur (stronger displacement + ~28 strands + tufts over the
     face top); body wider/rounder with a curved right side, fully inside
     the 240 viewBox (old body clipped at y=250); thin light headphone band
     whose right end tucks behind the face (no sliver tab, no hinge block);
     slim cup hugging the body side; laptop bigger with a real 3x6 key grid,
     screen bezel + sheen, deck thickness + shadow; arms CREAM (not brown),
     thick with elbow bends, paws resting ON the keys.
     Sampled colors (verified by pixel sampling, Oct 25): body #E6D7C2 /
     #D8BEA6 / #C6A381, face #F8E3C9 / #EBD4B6, cup #AEACAD / #9E9E99,
     band #B6ADA7 / #82756E, blush #CF9780 / #F3C5AD, laptop #D2D0D1 /
     #B6B3B5, keys #584B3D, pupils #170D0A / #25100D.
     IDs: gradients/filters need ids. The same markup is inlined several
     times per page (FAB + panel header); every instance carries IDENTICAL
     defs, so duplicate ids still render identically in all browsers.
     States are NOT separate drawings: CSS classes in doki.css toggle the
     groups below (doki-thinkdots, doki-zzz, doki-eyes-closed,
     doki-eyes-worried, doki-smile-big, doki-mouth-o, doki-micring) and
     animate doki-art / doki-eyes / doki-arms. Never redraw per state. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" class="doki-svg" role="img" aria-label="Doki, the DoKit assistant">
  <defs>
    <!-- Body plush: light cream on top, tan only in the shaded pockets. -->
    <radialGradient id="dk-bodyGrad" cx="55%" cy="25%" r="95%">
      <stop offset="0%" stop-color="#E6D7C2"/>
      <stop offset="45%" stop-color="#D8BEA6"/>
      <stop offset="75%" stop-color="#C6A381"/>
      <stop offset="100%" stop-color="#C0A489"/>
    </radialGradient>
    <!-- Face pale oval: light top -> mid -> chin. -->
    <radialGradient id="dk-faceGrad" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#F8E3C9"/>
      <stop offset="55%" stop-color="#EBD4B6"/>
      <stop offset="100%" stop-color="#E2C9A9"/>
    </radialGradient>
    <!-- Headphone cup: outer light -> inner darker. -->
    <radialGradient id="dk-cupGrad" cx="42%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#AEACAD"/>
      <stop offset="100%" stop-color="#9E9E99"/>
    </radialGradient>
    <!-- Headphone band: dark at the cups, lit across the dome top. -->
    <linearGradient id="dk-bandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#82756E"/>
      <stop offset="45%" stop-color="#B6ADA7"/>
      <stop offset="100%" stop-color="#8A8680"/>
    </linearGradient>
    <!-- Laptop screen back: light -> edge shade. -->
    <linearGradient id="dk-screenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B9B4B1"/>
      <stop offset="35%" stop-color="#D2D0D1"/>
      <stop offset="100%" stop-color="#D2D0D1"/>
    </linearGradient>
    <!-- Laptop deck: light silver surface. -->
    <linearGradient id="dk-deckGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B6B3B5"/>
      <stop offset="100%" stop-color="#B0ACAA"/>
    </linearGradient>
    <!-- Blush: sampled pigment fading out (soft video edge). -->
    <radialGradient id="dk-blushL">
      <stop offset="0%" stop-color="#CF9780" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#CF9780" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#CF9780" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dk-blushR">
      <stop offset="0%" stop-color="#F3C5AD" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#F3C5AD" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#F3C5AD" stop-opacity="0"/>
    </radialGradient>
    <!-- Fur edge: stronger displacement so the fuzzy plush outline actually
         reads at 60-480px (old scale 2.5 was invisible). -->
    <filter id="dk-fur" x="-6%" y="-6%" width="112%" height="112%">
      <feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5"/>
    </filter>
    <!-- Soft edge for the face oval (video blends fur into face, no hard line). -->
    <filter id="dk-soft" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <g class="doki-art">
    <!-- Body: wide round plush blob, fully inside the viewBox (y<=238).
         No straight right edge, no clipped bottom (old path hit y=250). -->
    <g class="doki-body">
      <path d="M120 20 C88 20 60 34 47 62 C35 90 29 130 30 170 C31 205 44 230 75 234 C105 238 150 237 172 228 C192 219 198 195 196 165 C194 130 190 92 181 62 C172 36 148 20 120 20 Z"
        fill="url(#dk-bodyGrad)" filter="url(#dk-fur)"/>
      <!-- Lit right flank + soft light patches breaking up the lower body. -->
      <ellipse cx="158" cy="142" rx="16" ry="30" fill="#E4D0BC" opacity="0.45"/>
      <ellipse cx="95" cy="200" rx="30" ry="18" fill="#D8BEA6" opacity="0.35"/>
      <ellipse cx="60" cy="165" rx="16" ry="26" fill="#E6D7C2" opacity="0.30"/>
      <ellipse cx="120" cy="150" rx="34" ry="20" fill="#EDE0CC" opacity="0.28"/>
      <ellipse cx="80" cy="215" rx="26" ry="14" fill="#EDE0CC" opacity="0.25"/>
      <ellipse cx="150" cy="200" rx="22" ry="14" fill="#EDE0CC" opacity="0.22"/>
      <ellipse cx="180" cy="120" rx="12" ry="22" fill="#EDE0CC" opacity="0.25"/>
      <!-- Fur strands: dome, both sides, lower body (video fur is everywhere). -->
      <path d="M70 35 q4 -7 9 -3 M88 27 q5 -6 9 -1 M108 24 q5 -6 9 -1 M128 26 q5 -6 9 -1 M52 62 q2 -9 8 -5 M44 88 q1 -8 6 -5 M36 118 q0 -9 6 -6 M32 165 q1 -8 6 -5 M40 200 q1 -8 6 -4 M60 222 q3 -7 8 -3 M150 30 q5 -6 9 -1 M172 48 q4 -7 8 -2 M188 80 q3 -8 7 -3 M194 120 q2 -8 6 -3 M190 165 q2 -8 6 -3 M178 205 q3 -7 8 -2 M120 224 q4 -6 9 -1 M90 228 q4 -6 8 -1"
        stroke="#E6D7C2" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.55"/>
      <path d="M80 40 q2 -7 6 -3 M100 32 q2 -7 6 -2 M140 34 q2 -7 6 -2 M48 140 q1 -8 6 -4 M52 185 q1 -8 6 -4 M184 100 q2 -8 6 -3 M186 145 q2 -8 6 -3 M110 215 q3 -6 8 -2 M140 220 q3 -6 8 -2"
        stroke="#A3846F" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.45"/>
      <path d="M62 48 q3 -7 8 -3 M96 30 q3 -7 8 -2 M116 28 q3 -7 8 -2 M136 30 q3 -7 8 -2 M156 40 q3 -7 8 -2 M40 105 q2 -8 6 -4 M34 145 q2 -8 6 -4 M44 178 q2 -8 6 -4 M56 208 q3 -7 8 -3 M74 228 q3 -6 8 -2 M100 232 q3 -6 8 -2 M132 230 q3 -6 8 -2 M160 222 q3 -7 8 -2 M182 190 q2 -8 6 -3 M192 140 q2 -8 6 -3 M188 95 q2 -8 6 -3 M176 62 q3 -7 8 -2 M140 180 q3 -7 8 -2 M110 160 q3 -7 8 -2 M84 120 q2 -8 6 -4 M150 100 q3 -7 8 -2"
        stroke="#EDE0CC" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
    </g>
    <!-- Headphone band: THIN (5 units, video strap ~2-3% of frame), over the
         dome. Drawn BEFORE the face so the right end tucks behind the face
         edge instead of rendering as a tab on the cheek. No sliver, no hinge. -->
    <g class="doki-ears">
      <path d="M55 72 C62 42 85 20 112 19 C138 18 158 36 170 72"
        stroke="url(#dk-bandGrad)" stroke-width="5" fill="none" stroke-linecap="round"/>
    </g>
    <!-- Face: pale oval, tilted -4 deg for the 3/4 read. All face features
         live inside this rotated group so eyes/blush/smile turn together. -->
    <g class="doki-face" transform="rotate(-4 137 92)">
      <ellipse cx="137" cy="92" rx="47" ry="36" fill="url(#dk-faceGrad)" filter="url(#dk-soft)"/>
      <!-- Left-edge shade. -->
      <ellipse cx="102" cy="95" rx="12" ry="22" fill="#D0B497" opacity="0.35"/>
      <!-- Blush: smaller than before (rx 6, video ~13% of face width). -->
      <ellipse cx="115" cy="104" rx="8.5" ry="5.5" fill="url(#dk-blushL)"/>
      <ellipse cx="156" cy="100" rx="8.5" ry="5.5" fill="url(#dk-blushR)"/>
      <!-- Eyes: ROUND beads (old rx 4.5 / ry 9 tall ovals were wrong).
           Far eye (right) slightly smaller + higher: 3/4 foreshortening. -->
      <g class="doki-eyes">
        <ellipse cx="120" cy="90" rx="5" ry="5.5" fill="#170D0A"/>
        <ellipse cx="155" cy="88" rx="4.5" ry="5" fill="#25100D"/>
        <ellipse cx="119" cy="86" rx="1.4" ry="1.8" fill="#DBC8AF" opacity="0.95"/>
        <ellipse cx="154" cy="84" rx="1.3" ry="1.7" fill="#CFBCA5" opacity="0.95"/>
      </g>
      <!-- Closed eyes (sleep state only) -->
      <g class="doki-eyes-closed">
        <path d="M112 90 Q120 97 128 90" stroke="#170D0A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M147 88 Q155 95 163 88" stroke="#170D0A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>
      <!-- Worried eyes (error state only) -->
      <g class="doki-eyes-worried">
        <path d="M112 92 Q120 85 128 92" stroke="#170D0A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <path d="M147 90 Q155 83 163 90" stroke="#170D0A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>
      <!-- Mouths: hairline tiny smile (old 14-wide / 2px stroke was too big). -->
      <g class="doki-smile">
        <path d="M137 101 Q141 105.5 145 101" stroke="#070000" stroke-width="1.5" fill="none" stroke-linecap="round"/>
      </g>
      <g class="doki-smile-big">
        <path d="M128 99 Q141 112 154 99" stroke="#070000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      </g>
      <g class="doki-mouth-o">
        <ellipse cx="141" cy="104" rx="4.5" ry="6" fill="#070000"/>
      </g>
    </g>
    <!-- Fur tufts falling over the face's top edge (video forehead fringe). -->
    <path d="M105 62 q3 -6 7 -2 M125 57 q4 -6 8 -1 M145 57 q4 -6 8 -1 M163 62 q3 -6 7 -2"
      stroke="#E6D7C2" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.6"/>
    <!-- Left cup: SLIM oval hugging the body side (old 24x30 fat oval floated).
         Tilted with the head; no right-side hardware at all. -->
    <g class="doki-cup">
      <ellipse cx="50" cy="94" rx="20" ry="30" fill="url(#dk-cupGrad)" stroke="#A19F9C" stroke-width="1.5" transform="rotate(-6 50 94)"/>
      <ellipse cx="56" cy="94" rx="12" ry="19" fill="#9E9E99" stroke="#A19F9C" stroke-width="1" transform="rotate(-6 50 94)"/>
    </g>
    <!-- Laptop: bigger, right side, real key grid, bezel + sheen, deck
         thickness + shadow. Screen right edge 235 (never the 240 edge). -->
    <g class="doki-laptop">
      <ellipse cx="170" cy="220" rx="65" ry="6" fill="#000000" opacity="0.06"/>
      <polygon points="100,198 235,206 235,218 100,210" fill="url(#dk-deckGrad)"/>
      <g fill="#584B3D">
        <rect x="130" y="200" width="12" height="3"/><rect x="146" y="200" width="12" height="3"/><rect x="162" y="201" width="12" height="3"/><rect x="178" y="201" width="12" height="3"/><rect x="194" y="202" width="12" height="3"/><rect x="210" y="202" width="12" height="3"/>
        <rect x="130" y="204" width="12" height="3"/><rect x="146" y="204" width="12" height="3"/><rect x="162" y="205" width="12" height="3"/><rect x="178" y="205" width="12" height="3"/><rect x="194" y="206" width="12" height="3"/><rect x="210" y="206" width="12" height="3"/>
        <rect x="130" y="208" width="12" height="3"/><rect x="146" y="208" width="12" height="3"/><rect x="162" y="209" width="12" height="3"/><rect x="178" y="209" width="12" height="3"/><rect x="194" y="210" width="12" height="3"/><rect x="210" y="210" width="12" height="3"/>
      </g>
      <polygon points="198,208 235,203 235,108 202,113" fill="url(#dk-screenGrad)"/>
      <polygon points="206,206 231,202 231,112 206,116" fill="none" stroke="#B9B4B1" stroke-width="1"/>
      <polygon points="210,200 225,112 231,112 216,200" fill="#FFFFFF" opacity="0.20"/>
      <polygon points="198,208 235,203 235,108 202,113" fill="none" stroke="#A9A5A1" stroke-width="1.5"/>
    </g>
    <!-- Arms: CREAM like the body (old right arm was brown #9C7655), thick,
         elbow-bent, paws resting ON the key grid (not hovering). -->
    <g class="doki-arms">
      <path d="M46 140 C75 150 105 168 128 184 C136 190 138 196 132 200 C126 204 114 201 105 194 C86 183 62 168 50 154 C43 147 42 142 46 140 Z" fill="#DDCAB3"/>
      <ellipse cx="132" cy="197" rx="17" ry="11" fill="#E6D7C2" transform="rotate(-8 132 197)"/>
      <path d="M168 150 C178 158 190 168 198 180 C202 187 200 193 194 194 C187 195 178 187 172 176 C166 166 164 154 168 150 Z" fill="#D8BEA6"/>
      <ellipse cx="196" cy="193" rx="15" ry="10" fill="#E6D7C2" transform="rotate(-10 196 193)"/>
      <path d="M60 150 q2 -8 6 -4 M80 168 q2 -8 6 -4 M100 184 q2 -8 6 -4 M176 162 q2 -8 6 -3 M188 176 q2 -8 6 -3"
        stroke="#E6D7C2" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/>
      <path d="M70 158 q2 -8 6 -4 M92 176 q2 -8 6 -4 M112 190 q2 -8 6 -4 M182 168 q2 -8 6 -3 M192 182 q2 -8 6 -3"
        stroke="#EDE0CC" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.5"/>
    </g>
    <!-- State overlays (all hidden by default; doki.css shows them per state) -->
    <g class="doki-thinkdots">
      <circle cx="82" cy="14" r="6" fill="#6C4CF1"/>
      <circle cx="107" cy="8" r="6" fill="#6C4CF1"/>
      <circle cx="132" cy="14" r="6" fill="#6C4CF1"/>
    </g>
    <g class="doki-zzz">
      <text x="186" y="56" font-size="16" font-weight="800" font-family="system-ui, sans-serif" fill="#6C4CF1">z</text>
      <text x="198" y="40" font-size="22" font-weight="800" font-family="system-ui, sans-serif" fill="#6C4CF1">z</text>
      <text x="210" y="24" font-size="28" font-weight="800" font-family="system-ui, sans-serif" fill="#6C4CF1">z</text>
    </g>
    <circle class="doki-micring" cx="128" cy="125" r="105" fill="none" stroke="#6C4CF1" stroke-width="4" opacity="0.8"/>
  </g>
</svg>
