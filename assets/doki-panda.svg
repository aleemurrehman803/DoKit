<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Doki the panda typing at a laptop">
  <defs>
    <radialGradient id="dokiHead" cx="50%" cy="35%" r="78%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e8ebf4"/>
    </radialGradient>
    <linearGradient id="dokiCup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b7bff"/>
      <stop offset="100%" stop-color="#5b3df0"/>
    </linearGradient>
    <linearGradient id="dokiScreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6f5df6"/>
      <stop offset="100%" stop-color="#4330c9"/>
    </linearGradient>
  </defs>

  <!-- soft ground shadow -->
  <ellipse cx="48" cy="89" rx="30" ry="4.5" fill="#2b2f38" opacity="0.12"/>

  <!-- torso peeking behind laptop -->
  <ellipse class="panda-body" cx="48" cy="70" rx="20" ry="14" fill="url(#dokiHead)"/>

  <!-- ears -->
  <circle cx="29" cy="20" r="9" fill="#2e3340"/>
  <circle cx="67" cy="20" r="9" fill="#2e3340"/>

  <!-- head -->
  <g class="panda-head">
    <circle cx="48" cy="36" r="23" fill="url(#dokiHead)"/>
    <!-- eye patches -->
    <ellipse cx="39" cy="36" rx="6.6" ry="8.2" fill="#2e3340" transform="rotate(-12 39 36)"/>
    <ellipse cx="57" cy="36" rx="6.6" ry="8.2" fill="#2e3340" transform="rotate(12 57 36)"/>
    <!-- eyes (blink via CSS scaleY) -->
    <g class="panda-eye">
      <circle cx="39" cy="36" r="3.4" fill="#ffffff"/>
      <circle cx="39.7" cy="36.7" r="1.7" fill="#23262e"/>
      <circle cx="38.3" cy="34.7" r="0.8" fill="#ffffff"/>
    </g>
    <g class="panda-eye">
      <circle cx="57" cy="36" r="3.4" fill="#ffffff"/>
      <circle cx="57.7" cy="36.7" r="1.7" fill="#23262e"/>
      <circle cx="56.3" cy="34.7" r="0.8" fill="#ffffff"/>
    </g>
    <!-- blush -->
    <ellipse cx="30.5" cy="46" rx="4" ry="2.6" fill="#ffb3c7" opacity="0.6"/>
    <ellipse cx="65.5" cy="46" rx="4" ry="2.6" fill="#ffb3c7" opacity="0.6"/>
    <!-- nose + smile -->
    <ellipse cx="48" cy="45" rx="3" ry="2.2" fill="#23262e"/>
    <path d="M48 47.4 Q48 50 44.6 50.4 M48 47.4 Q48 50 51.4 50.4" stroke="#23262e" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- headphones -->
  <g class="panda-phones">
    <path d="M29 19 Q29 5 48 5 Q67 5 67 19" stroke="url(#dokiCup)" stroke-width="5" fill="none" stroke-linecap="round"/>
    <rect x="20.5" y="12.5" width="13" height="17" rx="6.5" fill="url(#dokiCup)"/>
    <rect x="62.5" y="12.5" width="13" height="17" rx="6.5" fill="url(#dokiCup)"/>
    <rect x="23.6" y="16.5" width="6.8" height="9" rx="3.4" fill="#ffffff" opacity="0.35"/>
    <rect x="65.6" y="16.5" width="6.8" height="9" rx="3.4" fill="#ffffff" opacity="0.35"/>
  </g>

  <!-- laptop -->
  <g class="panda-laptop">
    <rect x="27" y="54" width="42" height="26" rx="4" fill="#2e3340"/>
    <rect x="30.5" y="57.5" width="35" height="19" rx="2" fill="url(#dokiScreen)"/>
    <rect x="30.5" y="57.5" width="35" height="19" rx="2" fill="#ffffff" opacity="0.10"/>
    <!-- tiny code lines (hidden while working) -->
    <g class="panda-code" fill="#ffffff">
      <rect x="34" y="61" width="14" height="2.4" rx="1.2" opacity="0.75"/>
      <rect x="34" y="65.6" width="21" height="2.4" rx="1.2" opacity="0.5"/>
      <rect x="34" y="70.2" width="10" height="2.4" rx="1.2" opacity="0.35"/>
    </g>
    <!-- typing dots (shown while working) -->
    <text class="panda-screen-dots" x="48" y="71" text-anchor="middle" font-size="10" font-weight="bold" fill="#ffffff" font-family="system-ui, sans-serif">...</text>
    <!-- base -->
    <rect x="22" y="80" width="52" height="7" rx="3.5" fill="#3a4050"/>
    <rect x="43" y="80" width="10" height="3" rx="1.5" fill="#23262e"/>
  </g>

  <!-- paws on the keyboard (typing via CSS) -->
  <g class="panda-paw-l">
    <ellipse cx="37" cy="79" rx="6.2" ry="4.6" fill="#2e3340"/>
    <ellipse cx="37" cy="78.2" rx="3" ry="1.9" fill="#59617a"/>
  </g>
  <g class="panda-paw-r">
    <ellipse cx="59" cy="79" rx="6.2" ry="4.6" fill="#2e3340"/>
    <ellipse cx="59" cy="78.2" rx="3" ry="1.9" fill="#59617a"/>
  </g>
</svg>
