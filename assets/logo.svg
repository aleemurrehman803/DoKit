<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DoKit logo">
  <defs>
    <linearGradient id="dkg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7D5CFF"/>
      <stop offset="1" stop-color="#4A2FD6"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#dkg)"/>
  <!-- wrench open-end jaw crowning the stem -->
  <path d="M16 15 A8.5 8.5 0 1 1 32.5 10.5" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round"/>
  <!-- wrench handle = the stem of the D -->
  <rect x="20.75" y="17" width="6.5" height="31" rx="3.25" fill="#ffffff"/>
  <!-- D bowl -->
  <path d="M24 19 C39 19 45.5 25 45.5 32.5 C45.5 40 39 46 24 46" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
</svg>
