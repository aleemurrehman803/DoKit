<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://www.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self' https://*.googleapis.com https://*.gstatic.com https://www.google.com; frame-src https://www.google.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
<meta name="theme-color" content="#6C4CF1">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icon.svg">
<title>Log In — DoKit</title>
<meta name="description" content="Log in to your DoKit account.">
<link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/hub.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header id="site-nav"></header>
<main id="main">
  <section class="section">
    <div class="container" style="max-width:480px">
      <div class="card form-card">
        <div class="section-head" style="text-align:center">
          <span class="eyebrow">Member access</span>
          <h1>Welcome back</h1>
        </div>
        <form id="loginForm" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input class="form-control text-input" id="email" name="email" type="email" autocomplete="email">
            <div class="form-error" id="err-email" role="alert"></div>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input class="form-control text-input" id="password" name="password" type="password" autocomplete="current-password">
            <div class="form-error" id="err-password" role="alert"></div>
          </div>
          <div class="field">
            <label for="capInput">Security check <span style="color:var(--text-muted)">(required every time)</span></label>
            <div style="display:flex;gap:var(--sp-2);align-items:stretch">
              <canvas id="capCanvas" width="160" height="56" style="border:1px solid var(--border);border-radius:var(--radius);background:#f4f2ff;max-width:100%" aria-hidden="true"></canvas>
              <button class="btn" id="capRefresh" type="button" title="Get a new code" aria-label="Get a new code" style="padding:0 var(--sp-3);font-size:1.25rem">↻</button>
            </div>
            <input class="form-control text-input" id="capInput" name="captcha" type="text" autocomplete="off" placeholder="Enter the code shown above" style="margin-top:var(--sp-2)" aria-label="Enter the security code shown in the image">
            <div class="form-error" id="err-captcha" role="alert"></div>
          </div>
          <div class="form-error" id="err-general" role="alert" style="margin-bottom:var(--sp-2)"></div>
          <button class="btn btn-primary" type="submit" style="width:100%">Log In</button>
        </form>
        <div style="display:flex;align-items:center;gap:var(--sp-2);margin:var(--sp-3) 0;color:var(--text-muted);font-size:var(--fs-sm)">
          <span style="flex:1;border-top:1px solid var(--border)"></span>or<span style="flex:1;border-top:1px solid var(--border)"></span>
        </div>
        <button class="btn" id="googleBtn" type="button" style="width:100%">Continue with Google</button>
        <p class="form-note" style="text-align:center;margin-top:var(--sp-3)">
          New to DoKit? <a href="signup.html">Create an account</a>
        </p>
        <p class="form-note" style="text-align:center;color:var(--text-muted);font-size:var(--fs-sm)">
          Secured by Firebase Authentication.
        </p>
      </div>
    </div>
  </section>
</main>
<footer id="site-foot"></footer>
<script src="../js/i18n-v2.js" defer></script>
<script src="../js/ui.js" defer></script>
<script src="../js/captcha.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js" defer></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check-compat.js" defer></script>
<script src="../js/firebase.js?v=20261007g" defer></script>
<script src="../js/pages/login.js?v=20261007f" defer></script>
</body>
</html>
