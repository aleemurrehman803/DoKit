<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
<meta name="theme-color" content="#6C4CF1">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Contact — DoKit</title>
<meta name="description" content="Contact DoKit: questions, ideas, or bug reports. We read everything.">
<link rel="canonical" href="https://aleemurrehman803.github.io/dokit/contact.html">
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/hub.css">
</head>
<body data-nav="contact">
<a class="skip-link" href="#main" data-i18n="skip_link">Skip to content</a>
<header id="site-nav"></header>
<main id="main">
  <section class="section">
    <div class="container" style="max-width:40rem">
      <nav aria-label="Breadcrumb">
        <ol class="breadcrumb">
          <li><a href="/" data-i18n="crumb_home">Home</a></li>
          <li aria-current="page" data-i18n="contact_title">Contact us</li>
        </ol>
      </nav>
      <h1 data-i18n="contact_title">Contact us</h1>
      <p style="color:var(--text-muted)" data-i18n="contact_sub">Questions, ideas, or bug reports — we read everything.</p>
      <form id="contactForm" class="card" style="margin-block:var(--sp-5)">
        <div class="field">
          <label for="cName" data-i18n="form_name">Your name</label>
          <input class="text-input" type="text" id="cName" required autocomplete="name">
        </div>
        <div class="field">
          <label for="cEmail" data-i18n="form_email">Your email</label>
          <input class="text-input" type="email" id="cEmail" required autocomplete="email" dir="ltr">
        </div>
        <div class="field">
          <label for="cSubject" data-i18n="form_subject">Subject</label>
          <input class="text-input" type="text" id="cSubject" required>
        </div>
        <div class="field">
          <label for="cMessage" data-i18n="form_message">Message</label>
          <textarea class="textarea" id="cMessage" required></textarea>
        </div>
        <button class="btn btn-primary btn-block" type="submit" data-i18n="form_send">Send message</button>
      </form>
      <div class="card">
        <h3 data-i18n="contact_note_t">Prefer email directly?</h3>
        <p style="margin:0" data-i18n="contact_note_d">Write to hello@getdokit.com — we usually reply within a couple of days.</p>
      </div>
    </div>
  </section>
</main>
<footer id="site-foot"></footer>
<script src="/js/i18n.js" defer></script>
<script src="/js/ui.js" defer></script>
<script src="/js/pages/info.js" defer></script>
<div id="dk-assistant-root"></div>
<script src="/js/assistant-kb.js" defer></script>
<script src="/js/assistant.js" defer></script>
</body>
</html>
