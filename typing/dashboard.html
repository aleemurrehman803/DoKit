<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6C4CF1">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>TypeMaster — Dashboard</title>
<meta name="description" content="Your TypeMaster dashboard: stats, problem keys, and recent typing tests.">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="site-nav"></div>
<main class="container">

  <div class="page-header">
    <p class="eyebrow" data-i18n="d_eyebrow_dashboard">Your journey</p>
    <h1 data-i18n="dash_title">Dashboard</h1>
    <p class="page-sub">
      <span data-i18n="welcome">Welcome</span>, <strong id="userName"></strong>
      &nbsp;<span class="plan-badge"><span data-i18n="plan_label">Plan</span>: <span data-i18n="plan_free">Free</span></span>
    </p>
  </div>

  <section class="card continue-card" id="continueCard" aria-label="Continue learning">
    <div>
      <p class="eyebrow" data-i18n="d_continue_title">Continue learning</p>
      <h2 id="continueLessonName">—</h2>
      <p class="text-muted" data-i18n="d_continue_sub">Pick up right where you left off — your next lesson is ready when you are.</p>
      <div class="continue-best">
        <span class="stat-value" id="bestWpm">0</span>
        <span class="stat-label" data-i18n="best_wpm">Best WPM</span>
      </div>
    </div>
    <div class="continue-cta">
      <a class="btn btn-primary btn-lg" id="continueLink" href="lessons.html"><span data-i18n="d_start">Start</span></a>
    </div>
  </section>

  <div class="stat-grid" id="statGrid">
    <div class="card stat-card">
      <div class="stat-num" id="streakCount">0</div>
      <div class="stat-label" data-i18n="day_streak">Day Streak</div>
    </div>
    <div class="card stat-card">
      <div class="stat-num" id="levelLabel">—</div>
      <div class="stat-label" data-i18n="xp_level">Level</div>
    </div>
    <div class="card stat-card">
      <div class="stat-num" id="lessonsDone">0</div>
      <div class="stat-label" data-i18n="d_lessons_done">Lessons done</div>
    </div>
  </div>

  <div class="grid grid-2 mt-3">
    <div class="card">
      <h2 class="section-title" data-i18n="problem_keys">Problem Keys</h2>
      <div id="problemKeys" class="mt-2"></div>
    </div>
    <div class="card">
      <h2 class="section-title" data-i18n="recent_tests">Recent Tests</h2>
      <div id="recentTests" class="mt-2"></div>
    </div>
  </div>

</main>
<div id="site-foot"></div>
<script src="js/urdu.js"></script>
<script src="js/urdu2.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/curriculum.js"></script>
<script src="js/pages/dashboard.js"></script>
</body>
</html>
