<body>
<div id="site-nav"></div>
<main class="container">

  <div class="page-header center">
    <p class="eyebrow" data-i18n="d_eyebrow_cert">Achievement</p>
    <h1 data-i18n="verify_title">Certificate Verification</h1>
    <p class="page-sub" data-i18n="verify_sub">Enter a registration number to check a TypeMaster certificate.</p>
  </div>

  <form id="verifyForm" class="card verify-form" autocomplete="off">
    <label for="regInput" data-i18n="cert_reg_no">Registration No.</label>
    <input id="regInput" class="text-input" type="text" data-i18n-ph="verify_ph" placeholder="e.g. DK-2026-AB12CD" spellcheck="false" autocapitalize="characters">
    <button class="btn btn-primary" type="submit" data-i18n="verify_btn">Verify</button>
  </form>

  <div id="verifyResult" class="verify-result" aria-live="polite"></div>

</main>
