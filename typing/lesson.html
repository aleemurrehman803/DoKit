<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6C4CF1">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Lesson — TypeMaster</title>
<meta name="description" content="Practice this TypeMaster lesson with live feedback, finger guidance, and accuracy scoring.">
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/player.css">
</head>
<body>
<div id="site-nav"></div>
<main class="container">
  <div id="playerArea" class="player-wrap">
    <div class="page-header">
      <p class="eyebrow" data-i18n="d_eyebrow_lesson">Practice session</p>
      <h1 id="lessonTitle">Lesson</h1>
      <p><span class="badge-chip" id="lessonKeys"></span></p>
    </div>
    <div class="player-stats">
      <div class="pstat"><span class="v" id="statWpm">0</span><span class="l" data-i18n="live_wpm">WPM</span></div>
      <div class="pstat"><span class="v" id="statAcc">100%</span><span class="l" data-i18n="live_acc">Accuracy</span></div>
      <div class="pstat"><span class="v" id="statTime">0:00</span><span class="l" data-i18n="live_time">Time</span></div>
    </div>
    <div class="type-text" id="typeText"></div>
    <input class="ghost-input" id="ghostInput" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="type-hint" data-i18n="player_hint">Click the text, then start typing. The timer starts on your first keystroke.</div>
    <div class="finger-hint" id="fingerHint"></div>
    <div id="kb"></div>
  </div>
  <div id="donePanel" class="player-wrap hidden"></div>
</main>
<div id="site-foot"></div>
<script src="js/urdu.js"></script>
<script src="js/urdu2.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/curriculum.js"></script>
<script src="js/gamification.js"></script>
<script src="js/engine.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/pages/lesson.js"></script>
</body>
</html>
