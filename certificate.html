<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Typing Certificate — TypeMaster</title>
<meta name="description" content="Earn your TypeMaster typing certificate: your name, best WPM, accuracy, and date on a printable award.">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="site-nav"></div>
<main class="container">

  <div class="page-header center">
    <p class="eyebrow" data-i18n="d_eyebrow_cert">Achievement</p>
    <h1 data-i18n="cert_title">Your Certificate</h1>
    <p class="page-sub" data-i18n="cert_sub">Proof of your typing skill — print it or share it.</p>
  </div>

  <div class="cert-paper card" id="certPaper">
    <div class="cert-brand">TypeMaster</div>
    <div class="cert-seal">★</div>
    <h2 data-i18n="cert_award_title">Certificate of Typing Achievement</h2>
    <p class="cert-presented" data-i18n="cert_presented_to">Proudly presented to</p>
    <div id="certName" class="cert-name">—</div>
    <div class="cert-stats">
      <div><span class="stat-value" id="certWpm">0</span><span class="stat-label" data-i18n="cert_l_wpm">WPM</span></div>
      <div><span class="stat-value" id="certAcc">0%</span><span class="stat-label" data-i18n="cert_l_acc">Accuracy</span></div>
      <div><span class="stat-value" id="certDate">—</span><span class="stat-label" data-i18n="cert_l_date">Date</span></div>
    </div>
    <div class="cert-sign">
      <span class="cert-sign-line"></span>
      <p data-i18n="cert_signature">TypeMaster Certification Board</p>
    </div>
  </div>

  <div class="text-center mt-3">
    <button class="btn btn-primary btn-lg no-print" id="printBtn" data-i18n="cert_print">Print Certificate</button>
  </div>

  <div id="certLogin" class="hidden card text-center mt-3">
    <p data-i18n="cert_login_msg">Log in to generate your personal certificate.</p>
    <a class="btn btn-outline mt-2" href="login.html" data-i18n="nav_login">Log In</a>
  </div>

</main>
<div id="site-foot"></div>
<script src="js/urdu.js"></script>
<script src="js/urdu2.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/certificate.js"></script>
<script src="js/pages/certificate.js"></script>
</body>
</html>
