<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TypeMaster — Typing Lessons</title>
<meta name="description" content="Structured typing lessons from beginner to advanced. Complete each lesson with 90%+ accuracy to unlock the next.">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="site-nav"></div>
<main class="container">

  <div class="page-head">
    <h1 data-i18n="lessons_title">Typing Lessons</h1>
    <p class="text-muted" data-i18n="lessons_sub">Complete each lesson with 90%+ accuracy to unlock the next.</p>
  </div>

  <div id="lessonLevels"></div>

</main>
<div id="site-foot"></div>
<script src="js/urdu.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/curriculum.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  UI.init({ active: 'lessons' });
  const progress = DB.getProgress();
  const levels = ['beginner', 'intermediate', 'advanced'];
  const wrap = document.getElementById('lessonLevels');

  levels.forEach(level => {
    const lessons = CURRICULUM.filter(l => l.level === level);
    let html = '<h2 class="level-heading"><span class="level-pill" data-i18n="' + level + '">' + UI.t(level) + '</span></h2>';
    html += '<div class="grid grid-3">';
    lessons.forEach(lesson => {
      const unlocked = isUnlocked(lesson.id, progress);
      const rec = progress.lessons[lesson.id] || {};
      const stars = UI.stars(rec.stars || 0);
      if (unlocked) {
        html += '<a class="lesson-card" href="lesson.html?id=' + encodeURIComponent(lesson.id) + '">' +
          '<h3>' + UI.esc(lesson.title) + '</h3>' +
          '<div class="lesson-keys">' + UI.esc(lesson.keys) + '</div>' +
          '<div class="mt-2">' + stars + '</div></a>';
      } else {
        html += '<div class="lesson-card locked">' +
          '<span class="lock-badge">🔒</span>' +
          '<h3>' + UI.esc(lesson.title) + '</h3>' +
          '<div class="lesson-keys">' + UI.esc(lesson.keys) + '</div>' +
          '<p class="text-muted mt-2" data-i18n="locked_tip">' + UI.t('locked_tip') + '</p></div>';
      }
    });
    html += '</div>';
    wrap.innerHTML += html;
  });

  UI.applyI18n(wrap);
});
</script>
</body>
</html>
