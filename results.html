<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Results — TypeMaster</title>
<meta name="description" content="Your typing test results: gross and net WPM, accuracy, typos, and per-key analysis.">
<link rel="stylesheet" href="css/main.css">
</head>
<body>
<div id="site-nav"></div>
<main class="container">
  <div class="page-header center">
    <p class="eyebrow" data-i18n="d_eyebrow_results">Your scorecard</p>
    <h1 data-i18n="test_done">Test Complete</h1>
    <p class="page-sub" id="resultSub"></p>
  </div>

  <div class="stat-grid">
    <div class="card stat-card"><div class="stat-num" id="rGwpm">0</div><div class="stat-label" data-i18n="gross_wpm">Gross WPM</div></div>
    <div class="card stat-card"><div class="stat-num" id="rNwpm">0</div><div class="stat-label" data-i18n="net_wpm">Net WPM</div></div>
    <div class="card stat-card"><div class="stat-num" id="rAcc">0%</div><div class="stat-label" data-i18n="accuracy">Accuracy</div></div>
    <div class="card stat-card"><div class="stat-num" id="rTypos">0</div><div class="stat-label" data-i18n="typos">Typos</div></div>
  </div>

  <div id="keyTableWrap" class="card mt-3 hidden">
    <h2 class="section-title" data-i18n="per_key">Per-key accuracy</h2>
    <div class="table-wrap mt-2">
      <table class="data-table">
        <thead><tr>
          <th data-i18n="per_key">Key</th>
          <th data-i18n="accuracy">Accuracy</th>
          <th data-i18n="times">n</th>
        </tr></thead>
        <tbody id="keyRows"></tbody>
      </table>
    </div>
  </div>

  <div class="share-card mt-3" id="shareCard"></div>

  <div class="text-center mt-3">
    <button class="btn btn-primary" id="shareBtn" data-i18n="share_result">Share Result</button>
    <button class="btn btn-outline" id="saveBtn" data-i18n="save_history">Save to History</button>
    <a class="btn btn-ghost" href="test.html" data-i18n="retake">Retake</a>
  </div>
  <p class="text-center mt-2 hidden" id="loginNote">
    <a href="login.html" data-i18n="nav_login">Login</a>
  </p>
  <div class="text-center mt-2" id="earnedWrap"></div>
</main>
<div id="site-foot"></div>
<script src="js/urdu.js"></script>
<script src="js/urdu2.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script src="js/gamification.js"></script>
<script src="js/pages/results.js"></script>
</body>
</html>
